name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax check
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/api/subscribers.py
          python -m py_compile app/api/devices.py

      - name: Start server and test health endpoint
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -f http://localhost:8000/health

      - name: Test API endpoints
        run: |
          curl -f http://localhost:8000/api/subscribers
          curl -f http://localhost:8000/api/subscribers/U001/devices
          curl -f http://localhost:8000/api/devices/D001/usage
          curl -f http://localhost:8000/

      # ---- TE 자동 검증 (요구사항 #1 ~ #3, 실제 Chromium) ----
      - name: Install TE dependencies (Playwright + Chromium)
        run: |
          pip install -r tests/requirements-te.txt
          python -m playwright install --with-deps chromium

      - name: TE - requirement 1
        run: |
          python tests/req1_test_template.py
          python tests/req1_e2e_test.py

      - name: TE - requirement 2
        run: python tests/req2_e2e_test.py

      - name: TE - requirement 3 (status badge)
        run: python tests/req3_e2e_test.py

      - name: Upload TE reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-reports
          path: tests/reports/

      # ---- (선택) CI 통과 시에만 Render 배포 ----
      # GitHub Secrets 에 RENDER_DEPLOY_HOOK_URL 이 등록된 경우에만 동작한다.
      - name: Trigger Render Deploy
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL 미등록 - Render Auto-Deploy 사용"
          fi
